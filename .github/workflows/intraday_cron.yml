name: NSE Intraday Paper Trader

on:
  schedule:
    # NSE Continuous Session: 09:15 to 15:30 IST (Mon-Fri)
    # In UTC (IST is UTC+5:30): 03:45 UTC to 10:00 UTC
    - cron: '45/5 3 * * 1-5'   # 03:45 - 03:55 UTC (09:15 - 09:25 IST)
    - cron: '*/5 4-9 * * 1-5'   # 04:00 - 09:55 UTC (09:30 - 15:25 IST)
  workflow_dispatch:
    inputs:
      simulate_now:
        description: 'Optional IST ISO timestamp (e.g., 2026-11-17T09:45:00+05:30) or empty for current time'
        required: false
        default: ''

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to persist daily trading state JSON back to git repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Intraday Trading Engine Cycle
        env:
          PAPER_TRADING: 'true'
          TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL || '50000' }}
          MAX_RISK_PCT: '0.01'
          RISK_REWARD_RATIO: '2.0'
          MAX_TRADES_PER_DAY: '1'
          MAX_LEVERAGE: '1.0'
          SLIPPAGE_BPS: '5.0'
          STATE_BACKEND: 'local'
          STATE_FILE_PATH: 'state'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.simulate_now }}" ]; then
            python lambda_handler.py --once --at "${{ github.event.inputs.simulate_now }}"
          else
            python lambda_handler.py --once
          fi

      - name: Commit and push updated trading state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          # Commit only if state changed (new entry, exit, or updated timestamp)
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore(state): update intraday trading state [skip ci]"
            git push
          fi
